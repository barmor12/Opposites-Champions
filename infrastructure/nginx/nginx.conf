# =====================================================================
# אלופי ההפכים – nginx ראשי (reverse proxy + TLS) – docker-compose.prod.yml
# Opposites Champions – main nginx (reverse proxy + TLS)
#
# נטען ל-/etc/nginx/nginx.conf (read-only). ה-server blocks מגיעים מ-template:
#   infrastructure/nginx/conf.d/app.conf.template            (HTTP→HTTPS + HTTPS)
#   infrastructure/nginx/conf.d/app.http-only.conf.template  (לפני שיש תעודה)
# ה-template שנבחר ב-compose נטען ל-/etc/nginx/templates/app.conf.template,
# וה-entrypoint של האימג' מריץ עליו envsubst (${DOMAIN}) ל-/etc/nginx/conf.d/app.conf.
# =====================================================================

user  nginx;
worker_processes auto;
pid   /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---- לוגים (כולל IP אמיתי מאחורי CDN אם מוגדר, ומשך הבקשה) ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" xff="$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # גודל גוף בקשה מקסימלי (העלאות קטנות בלבד; ייצוא Excel הוא תגובה, לא בקשה)
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # ---- Docker embedded DNS: פתרון שמות server/web בזמן ריצה (לא רק בעלייה) ----
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript application/json
        application/manifest+json image/svg+xml font/woff2 application/wasm;

    # ---- WebSocket upgrade ----
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- Real IP ----
    # ברירת מחדל: nginx הוא ה-edge, ולכן $remote_addr הוא כתובת הלקוח.
    # אם מוסיפים CDN/‏proxy לפני nginx (Cloudflare וכו') – יש לבטל הערה ולהגדיר את טווחי ה-CDN:
    # set_real_ip_from 173.245.48.0/20;
    # real_ip_header   CF-Connecting-IP;   # או X-Forwarded-For
    # real_ip_recursive on;

    # ---- Rate limiting ----
    # הערה חשובה: כיתה שלמה מתחברת לרוב מאותה כתובת IP (NAT של בית הספר)!
    # לכן ההגבלה על /api/rooms/join מתירה פרץ של כיתה שלמה (burst) ורק בולמת הצפה.
    limit_req_zone $binary_remote_addr zone=oc_join:10m  rate=60r/m;   # הצטרפות לחדר
    limit_req_zone $binary_remote_addr zone=oc_login:10m rate=10r/m;   # התחברות מורה (brute-force)
    limit_req_zone $binary_remote_addr zone=oc_api:10m   rate=50r/s;   # כלל ה-API
    limit_req_status 429;
    limit_req_log_level warn;

    # ---- server blocks (נוצר ע"י envsubst מ-template) ----
    include /etc/nginx/conf.d/app.conf;
}
