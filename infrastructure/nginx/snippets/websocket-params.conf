# Socket.IO / WebSocket – שדרוג חיבור + timeouts ארוכים (חיבור יכול להישאר פתוח שעות).
# נכלל *בנוסף* ל-proxy-params.conf (שמגדיר proxy_http_version 1.1 ואת כותרות ה-X-Forwarded-*).
# דורש את ה-map $connection_upgrade (מוגדר ב-nginx.conf / web.conf).
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_connect_timeout 10s;
proxy_read_timeout    3600s;
proxy_send_timeout    3600s;
proxy_buffering       off;
proxy_cache           off;
