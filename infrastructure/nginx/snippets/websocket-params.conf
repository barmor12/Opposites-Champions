# Socket.IO / WebSocket – שדרוג חיבור + timeouts ארוכים (חיבור יכול להישאר פתוח שעות).
# דורש את ה-map $connection_upgrade (מוגדר ב-nginx.conf / web.conf).
proxy_http_version 1.1;
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout  3600s;
proxy_send_timeout  3600s;
proxy_buffering     off;
proxy_cache         off;
