# פרמטרי proxy משותפים – העברת כתובת הלקוח האמיתית, הפרוטוקול וה-Host ל-upstream.
# השרת (NestJS) צריך `trust proxy` כדי לקרוא X-Forwarded-* (מגבלת קצב, Secure cookies).
# timeouts לא מוגדרים כאן (ברירת המחדל של nginx: 60s) – websocket-params.conf מאריך אותם
# ל-Socket.IO. אין לשכפל כאן הנחיות שמופיעות ב-websocket-params.conf (nginx אוסר כפילות).
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_redirect off;
# helmet בשרת מוסיף HSTS משלו; ה-nginx הראשי מוסיף אחד אחיד – מונעים כפילות
proxy_hide_header Strict-Transport-Security;
