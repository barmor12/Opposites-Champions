# כותרות אבטחה בסיסיות – נכללות בכל location שמגיש קבצים (add_header אינו יורש
# מרמת ה-server כאשר ב-location יש add_header משלו, לכן include מפורש).
# HSTS מוגדר רק ב-nginx הראשי (ב-HTTPS) – ראו conf.d/app.conf.template.
# CSP לא מוגדר כאן בכוונה (אודיו/פונטים/inline styles של Tailwind) – ניתן להוסיף בהמשך.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-XSS-Protection "0" always;
