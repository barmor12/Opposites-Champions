# =====================================================================
# אלופי ההפכים – nginx בתוך קונטיינר ה-web (הגשת ה-SPA)
# Opposites Champions – nginx inside the web container (serves the SPA)
#
# נטען ל-/etc/nginx/conf.d/default.conf באימג' nginx:1.27-alpine.
# - SPA fallback: כל נתיב לא-קיים → index.html (React Router)
# - gzip
# - cache ארוך ל-/assets (קבצים עם hash) ולמדיה סטטית, no-cache ל-index.html
# - כותרות אבטחה (snippets/security-headers.conf)
# - proxy ל-/api ו-/socket.io אל server:3000 – נוח לסטאק המקומי (docker-compose.yml)
#   שבו אין nginx חיצוני. בפרודקשן ה-nginx הראשי מנתב /api ו-/socket.io ישירות לשרת,
#   ולכן הבלוקים האלה לא נפגשים. הכתובת מוגדרת כמשתנה + resolver כדי שהקונטיינר
#   יעלה גם כשה-server עדיין לא קיים (nginx לא פותר את השם בזמן העלייה).
# =====================================================================

# Docker embedded DNS – פתרון שם דינמי (אם ה-server מקבל IP חדש אחרי restart)
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript application/json
        application/manifest+json image/svg+xml font/woff2 application/wasm;

    set $api_upstream http://server:3000;

    # ---- health (ל-HEALTHCHECK של docker) ----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- proxy ל-API (סטאק מקומי) ----
    location /api/ {
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_pass $api_upstream;
    }

    # ---- proxy ל-Socket.IO (סטאק מקומי) ----
    location /socket.io/ {
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/websocket-params.conf;
        proxy_pass $api_upstream;
    }

    # ---- נכסי Vite עם hash בשם – cache "לנצח" ----
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- מדיה סטטית מ-public (audio/avatars/images/fonts) – cache של 30 יום ----
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|mp3|ogg|wav|m4a|woff2?|ttf|otf|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ---- index.html – לעולם לא ב-cache (כדי שגרסה חדשה תיטען מיד) ----
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # ---- SPA fallback ----
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # קבצים מוסתרים (.git, .env וכו') – לא מגישים לעולם
    location ~ /\. {
        deny all;
        return 404;
    }
}
