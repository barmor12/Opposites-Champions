# =====================================================================
# אלופי ההפכים – docker compose (סטאק מלא לפיתוח/בדיקה מקומית)
# Opposites Champions – local full stack: db + server + web
#
#   cp .env.example .env            # ולערוך סיסמאות/סודות
#   docker compose up -d --build
#   http://localhost:8080           # ה-web מנתב /api ו-/socket.io לשרת (ללא CORS)
#
# לפרודקשן משלבים עם docker-compose.prod.yml (nginx + TLS + certbot + backup):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# כל הסודות מגיעים מ-.env (לא נשמר ב-git). אין ערכים קשיחים כאן.
# =====================================================================

name: opposites

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ---------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB missing in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ה-DB לא חשוף למארח כברירת מחדל (גישה רק מהרשת הפנימית backend).
    # לגישה מקומית עם כלי DB (DBeaver / psql) – בטלו הערה. לעולם לא בפרודקשן ללא 127.0.0.1!
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    logging: *default-logging

  # ---------------------------------------------------------------
  # NestJS API + Socket.IO (port 3000, prefix /api)
  # ---------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: opposites/server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # דורס את DATABASE_URL של .env (שמכוון ל-localhost) – בתוך הרשת ה-DB נקרא "db".
      # אם הסיסמה מכילה תווים מיוחדים (@ : / # %) יש לקודד אותה URL-encoded.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: "3000"
      # הרצת seed בעלייה (מורה ראשונית + תוכן). לרוב רק בפעם הראשונה: RUN_SEED=true docker compose up -d server
      RUN_SEED: ${RUN_SEED:-false}
    expose:
      - "3000"
    # גישה ישירה ל-API מהמארח (לדיבאג בלבד) – בטלו הערה:
    # ports:
    #   - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - backend
      - frontend
    logging: *default-logging

  # ---------------------------------------------------------------
  # SPA (nginx) – בסטאק המקומי חשוף ב-8080 ומנתב /api ו-/socket.io לשרת
  # ---------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: opposites/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
    logging: *default-logging

volumes:
  pgdata:

networks:
  # backend: רק db ↔ server (ו-backup בפרודקשן). internal – ללא גישה החוצה/מבחוץ.
  backend:
    internal: true
  # frontend: web ↔ server ↔ nginx (בפרודקשן)
  frontend:
