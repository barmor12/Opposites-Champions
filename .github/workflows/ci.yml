name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opposites
          POSTGRES_PASSWORD: opposites
          POSTGRES_DB: opposites
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U opposites" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://opposites:opposites@localhost:5432/opposites?schema=public
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      COOKIE_SECRET: ci-cookie-secret-at-least-32-characters-long
      TEACHER_INITIAL_EMAIL: teacher@example.com
      TEACHER_INITIAL_PASSWORD: ci-teacher-password
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oc/server prisma:generate
      - run: pnpm --filter @oc/server exec prisma migrate deploy
      - run: pnpm --filter @oc/server prisma:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm --filter @oc/server test:int
      - name: E2E
        run: |
          pnpm --filter @oc/e2e exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: tests/e2e/playwright-report }
