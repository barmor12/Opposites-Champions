# =====================================================================
# אלופי ההפכים – override לפרודקשן (VPS)
# Opposites Champions – production override: nginx (TLS) + certbot + backup
#
# תמיד יחד עם הקובץ הבסיסי:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   (scripts/deploy.sh ו-scripts/init-letsencrypt.sh עושים זאת עבורכם)
#
# דורש Docker Compose v2.24+ (בגלל !reset). נדרשים ב-.env: DOMAIN, LETSENCRYPT_EMAIL,
# POSTGRES_*, JWT_SECRET, COOKIE_SECRET, APP_URL=https://<DOMAIN>, CORS_ORIGINS=https://<DOMAIN>.
#
# תעודות ו-ACME webroot נשמרים ב-bind mounts תחת infrastructure/certbot/ (מוחרג ב-.gitignore).
# =====================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    # בפרודקשן: לעולם לא לחשוף פורט. גיבויים דרך ה-sidecar / scripts/backup-db.sh
    logging: *default-logging

  server:
    environment:
      NODE_ENV: production
    logging: *default-logging

  web:
    # בפרודקשן ה-web נגיש רק דרך nginx – מבטלים את מיפוי הפורט 8080 של הקובץ הבסיסי
    ports: !reset []
    expose:
      - "80"
    logging: *default-logging

  # ---------------------------------------------------------------
  # nginx – reverse proxy, TLS termination, rate limiting
  # ---------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN missing in .env}
      # ה-entrypoint של האימג' מריץ envsubst על /etc/nginx/templates/*.template → /etc/nginx/conf.d/
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # בחירת template: ברירת מחדל HTTPS; בהרצה הראשונה (לפני תעודה) init-letsencrypt.sh
      # מריץ עם NGINX_TEMPLATE=app.http-only.conf.template
      - ./infrastructure/nginx/conf.d/${NGINX_TEMPLATE:-app.conf.template}:/etc/nginx/templates/app.conf.template:ro
      - ./infrastructure/nginx/snippets:/etc/nginx/snippets:ro
      - ./infrastructure/certbot/www:/var/www/certbot:ro
      - ./infrastructure/certbot/conf:/etc/letsencrypt:ro
    # reload כל 6 שעות כדי לטעון תעודה מחודשת (certbot מחדש ברקע). ה-entrypoint של
    # האימג' (templates/envsubst) עדיין רץ כי לא דרסנו entrypoint, רק command.
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'"]
    depends_on:
      server:
        condition: service_started
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - frontend
    logging: *default-logging

  # ---------------------------------------------------------------
  # certbot – חידוש אוטומטי (בדיקה כל 12 שעות; מחדש כשנותרו <30 יום)
  # ההנפקה הראשונה: scripts/init-letsencrypt.sh
  # ---------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./infrastructure/certbot/www:/var/www/certbot
      - ./infrastructure/certbot/conf:/etc/letsencrypt
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    logging: *default-logging

  # ---------------------------------------------------------------
  # backup – pg_dump יומי ל-volume "backups", שמירת BACKUP_KEEP_DAYS ימים (ברירת מחדל 14)
  # קבצי .dump (פורמט custom של pg_dump) – שחזור עם scripts/restore-db.sh
  # הוצאת גיבוי למארח:  docker compose cp backup:/backups ./backups
  # ---------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "[backup] every $${BACKUP_INTERVAL_SECONDS}s, keeping $${BACKUP_KEEP_DAYS} days"
        while :; do
          until pg_isready -q; do echo "[backup] waiting for db…"; sleep 5; done
          ts="$$(date +%Y%m%d-%H%M%S)"
          if pg_dump -Fc -f "/backups/opposites-$${ts}.dump"; then
            echo "[backup] ok: opposites-$${ts}.dump ($$(du -h "/backups/opposites-$${ts}.dump" | cut -f1))"
          else
            echo "[backup] FAILED at $${ts}" >&2
            rm -f "/backups/opposites-$${ts}.dump"
          fi
          find /backups -name 'opposites-*.dump' -type f -mtime +"$${BACKUP_KEEP_DAYS}" -print -delete | sed 's/^/[backup] pruned: /'
          sleep "$${BACKUP_INTERVAL_SECONDS}" & wait $$!
        done
    networks:
      - backend
    logging: *default-logging

volumes:
  backups:
